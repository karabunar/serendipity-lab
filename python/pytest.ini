; Test configuration for the offline scripts under python/.
;
; Without `pythonpath = .` the suite only ran with `cd scripts` (imports are
; relative to rootdir). Running `pytest canonical_dict/tests` from the repo
; root raised import errors; this file makes both invocation styles work.
[pytest]
pythonpath = .
testpaths = canonical_dict/tests agentic_curator/tests ner_service
