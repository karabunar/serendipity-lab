# Local Qdrant. Start it with: docker compose up -d qdrant
# Go adapter: vectordb.NewQdrant("http://localhost:6333", "", 10*time.Second)
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
